name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retro-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out arcade source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify Android game assets
        run: |
          test -f index.html
          test -f lunar-lander.js
          test -f galaga.js
          npm run test:smoke
      - name: Build standalone APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Rename Android APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/Retro-Games-Arcade-Android.apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Retro-Games-Arcade-Android-APK
          path: dist/Retro-Games-Arcade-Android.apk
          if-no-files-found: error
